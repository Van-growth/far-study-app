name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Server
        run: curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}"

      - name: Deploy Client
        run: curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}"
