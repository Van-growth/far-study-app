name: Daily Briefing

on:
  schedule:
    # UTC 22:00 = KST 07:00
    - cron: '0 22 * * *'
  workflow_dispatch: # manual trigger for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-briefing Edge Function
        run: |
          response=$(curl -sS --fail -w "\n%{http_code}" -X POST \
            "https://rtvxplocohllzwdlzjaz.supabase.co/functions/v1/daily-briefing" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n1)
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status — $body"
          [ "$status" = "200" ] || exit 1
